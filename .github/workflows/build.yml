name: Build iOS App

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Find project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No .xcodeproj found!"
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: List schemes
        shell: bash
        run: |
          xcodebuild -list -project "$PROJECT"

      - name: Detect scheme
        shell: bash
        run: |
          SCHEME=$(xcodebuild -list -project "$PROJECT" \
            | awk '/Schemes:/{getline; print $1}')

          if [ -z "$SCHEME" ]; then
            echo "No scheme found!"
            exit 1
          fi

          echo "Using scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Show build output
        run: |
          find build

      - name: Package app
        shell: bash
        run: |
          APP=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found!"
            exit 1
          fi

          echo "Packaging $APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: app.zip